spring.application.name=demo
# Conexion a PostgreSQL Supabase
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Configuracion Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.packages-to-scan=com.example.demo.microservices.controller

spring.liquibase.change-log=classpath:/db/changelog/db.changelog-master.xml

app.pagination.page-size=${APP_PAGE_SIZE}
app.pagination.page-number=${APP_PAGE_NUMBER}