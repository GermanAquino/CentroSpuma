openapi: 3.0.1
info:
  title: Demo API
  version: 1.0.0
paths:
  /usuarios:
    get:
      summary: Obtener lista de usuarios
      responses:
        '200':
          description: Lista de usuarios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UsuarioDTO'
components:
  schemas:
    UsuarioRequestDTO:
      type: object
      required:
        - nombre
        - email
      properties:
        nombre:
          type: string
          example: "Juan Pérez"
        email:
          type: string
          format: email
          example: "juan@example.com"
        contrasena:
          type: string
          format: password
          example: "123456"

    UsuarioResponseDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        nombre:
          type: string
          example: "Juan Pérez"
        email:
          type: string
          example: "juan@example.com"
