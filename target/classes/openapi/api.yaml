openapi: 3.0.1
info:
  title: Demo API
  version: 1.0.0
paths:
  /usuarios:
    post:
      summary: Crear usuario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioRequestDTO'
      responses:
        '201':
          description: Usuario creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioResponseDTO'
components:
  schemas:
    UsuarioRequestDTO:
      type: object
      required:
        - nombre
        - email
        - contrasena
        - rolId
      properties:
        nombre:
          type: string
        email:
          type: string
          format: email
        contrasena:
          type: string
          format: password
        rolId:
          type: integer
          format: int64
        perfil:
          $ref: '#/components/schemas/PerfilRequestDTO'

    UsuarioResponseDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nombre:
          type: string
        email:
          type: string
        rol:
          $ref: '#/components/schemas/RolResponseDTO'
        perfil:
          $ref: '#/components/schemas/PerfilResponseDTO'

    RolResponseDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nombre:
          type: string
    PerfilRequestDTO:
      type: object
      properties:
        telefono:
          type: string
        direccion:
          type: string
        avatarUrl:
          type: string
          format: uri

    PerfilResponseDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        telefono:
          type: string
        direccion:
          type: string
        avatarUrl:
          type: string
          format: uri
    CategoriaRequestDTO:
      type: object
      properties:
        nombre:
          type: string
      required:
        - nombre

    CategoriaResponseDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nombre:
          type: string
        productosIds:
          type: array
          items:
            type: integer
            format: int64
    ProveedorRequestDTO:
      type: object
      properties:
        nombre:
          type: string
        direccion:
          type: string
          nullable: true
        telefono:
          type: string
          nullable: true
        ruc:
          type: string
          nullable: true
      required:
        - nombre

    ProveedorResponseDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nombre:
          type: string
        direccion:
          type: string
          nullable: true
        telefono:
          type: string
          nullable: true
        ruc:
          type: string
          nullable: true
    ClienteRequestDTO:
      type: object
      properties:
        nombre:
          type: string
        direccion:
          type: string
          nullable: true
        telefono:
          type: string
          nullable: true
        ruc:
          type: string
          nullable: true
      required:
        - nombre

    ClienteResponseDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nombre:
          type: string
        direccion:
          type: string
          nullable: true
        telefono:
          type: string
          nullable: true
        ruc:
          type: string
          nullable: true
    VentaRequestDTO:
      type: object
      properties:
        clienteId:
          type: integer
          format: int64
        fecha:
          type: string
          format: date-time
        total:
          type: number
          format: double
        detalles:
          type: array
          items:
            $ref: '#/components/schemas/DetalleVentaRequestDTO'

    VentaResponseDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        cliente:
          $ref: '#/components/schemas/ClienteResponseDTO'
        fecha:
          type: string
          format: date-time
        total:
          type: number
          format: double
        detalles:
          type: array
          items:
            $ref: '#/components/schemas/DetalleVentaResponseDTO'

    DetalleVentaRequestDTO:
      type: object
      properties:
        productoId:
          type: integer
          format: int64
        cantidad:
          type: number
          format: double
        precio:
          type: number
          format: double

    DetalleVentaResponseDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        producto:
          $ref: '#/components/schemas/ProductoResponseDTO'
        cantidad:
          type: number
          format: double
        precio:
          type: number
          format: double
    ProductoRequestDTO:
      type: object
      properties:
        nombre:
          type: string
        descripcion:
          type: string
        precio:
          type: number
          format: double
        stock:
          type: number
          format: double
        categoriasIds:
          type: array
          items:
            type: integer
            format: int64

    ProductoResponseDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nombre:
          type: string
        descripcion:
          type: string
        precio:
          type: number
          format: double
        stock:
          type: number
          format: double
        categorias:
          type: array
          items:
            $ref: '#/components/schemas/CategoriaResponseDTO'
    CompraRequestDTO:
      type: object
      properties:
        proveedorId:
          type: integer
          format: int64
        fecha:
          type: string
          format: date-time
        total:
          type: number
          format: double
        detalles:
          type: array
          items:
            $ref: '#/components/schemas/DetalleCompraRequestDTO'
      required:
        - proveedorId
        - total
        - detalles

    CompraResponseDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        proveedor:
          $ref: '#/components/schemas/ProveedorResponseDTO'
        fecha:
          type: string
          format: date-time
        total:
          type: number
          format: double
        detalles:
          type: array
          items:
            $ref: '#/components/schemas/DetalleCompraResponseDTO'

    DetalleCompraRequestDTO:
      type: object
      properties:
        productoId:
          type: integer
          format: int64
        cantidad:
          type: number
          format: double
        precio:
          type: number
          format: double
      required:
        - productoId
        - cantidad
        - precio

    DetalleCompraResponseDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        producto:
          $ref: '#/components/schemas/ProductoResponseDTO'
        cantidad:
          type: number
          format: double
        precio:
          type: number
          format: double
    FacturaRequestDTO:
      type: object
      properties:
        fecha:
          type: string
          format: date-time
        total:
          type: number
          format: double
        clienteId:
          type: integer
          format: int64
        detalles:
          type: array
          items:
            $ref: '#/components/schemas/DetalleFacturaRequestDTO'
      required:
        - total
        - clienteId
        - detalles

    FacturaResponseDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        fecha:
          type: string
          format: date-time
        total:
          type: number
          format: double
        cliente:
          $ref: '#/components/schemas/ClienteResponseDTO'
        detalles:
          type: array
          items:
            $ref: '#/components/schemas/DetalleFacturaResponseDTO'

    DetalleFacturaRequestDTO:
      type: object
      properties:
        precioTotal:
          type: number
          format: double
        ventaId:
          type: integer
          format: int64
      required:
        - precioTotal
        - ventaId

    DetalleFacturaResponseDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        precioTotal:
          type: number
          format: double
        venta:
          $ref: '#/components/schemas/VentaResponseDTO'